
services:
  mongo:
    image: mongo:6
    container_name: taskflow_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: taskflow_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    volumes :
      - ./frontend:/app/frontend  
volumes:
  mongo_data: