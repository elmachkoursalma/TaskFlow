<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — TaskFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { color: #3b5bdb; }
    .navbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
    .bell { position: relative; cursor: pointer; font-size: 24px; }
    .badge { position: absolute; top: -8px; right: -8px; background: #e03131; color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
    .notification { background: #f0f4ff; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #3b5bdb; }
    .notification.lu { background: #f8f9fa; border-left-color: #aaa; opacity: 0.7; }
    .notification p { margin: 0; font-size: 14px; }
    .notification small { color: #888; font-size: 12px; }
    .btn-read { background: #3b5bdb; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
    .btn-read:disabled { background: #aaa; cursor: default; }
    #logout { padding: 8px 16px; background: #e03131; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    #empty { text-align: center; color: #888; margin-top: 40px; }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>Notifications</h1>
    <div style="display: flex; align-items: center; gap: 20px;">
      <div class="bell" onclick="window.location.href='notifications.html'">
        🔔
        <span class="badge" id="badge" style="display:none;">0</span>
      </div>
      <button id="logout">Déconnexion</button>
    </div>
  </div>

  <div id="notificationsList"></div>
  <div id="empty" style="display:none;">Aucune notification pour le moment</div>

  <script src="js/notifications.js"></script>
</body>
</html>
