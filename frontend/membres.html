<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membres — TaskFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { color: #3b5bdb; }
    .card { background: #f0f4ff; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-size: 14px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .btn-blue { background: #3b5bdb; color: #fff; }
    .btn-red { background: #e03131; color: #fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; font-weight: 600; }
    .message { padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
    .success { background: #d3f9d8; color: #2f9e44; }
    .error { background: #ffe3e3; color: #c92a2a; }
    #logout { float: right; padding: 8px 16px; background: #e03131; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <button id="logout">Déconnexion</button>
  <h1>Gestion des membres</h1>

  <!-- Message de retour -->
  <div id="message" style="display:none;" class="message"></div>

  <!-- Formulaire invitation -->
  <div class="card">
    <h2>Inviter un membre</h2>
    <input type="email" id="emailInput" placeholder="Adresse email du membre...">
    <button class="btn btn-blue" onclick="inviterMembre()">Inviter</button>
  </div>

  <!-- Liste des membres -->
  <div class="card">
    <h2>Membres du projet</h2>
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="membersList"></tbody>
    </table>
  </div>

  <script src="js/members.js"></script>
</body>
</html>
