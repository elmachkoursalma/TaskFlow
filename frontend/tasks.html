<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Workspace des Tâches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* === APPLICATION DE TON THÈME DE COULEURS TRÈS EXACT === */
        body {
            background: linear-gradient(to right, #f5f0e6, #d6c7a1);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .theme-title { 
            color: #5c4033; 
        }
        .theme-card {
            background-color: #fffaf2 !important;
            border: 2px solid #8a7d4f !important;
            border-radius: 15px !important;
            box-shadow: 0 4px 15px rgba(92, 64, 51, 0.2) !important;
        }
        .theme-input {
            background-color: #fdf8f0 !important;
            border: 1px solid #8a7d4f !important;
            color: #5c4033 !important;
            border-radius: 8px !important;
        }
        .theme-input:focus {
            border-color: #5c4033 !important;
            box-shadow: 0 0 8px rgba(92, 64, 51, 0.3) !important;
        }
        .theme-btn {
            background-color: #6b5b3e !important;
            color: white !important;
            border-radius: 8px !important;
            border: none !important;
            transition: 0.3s !important;
        }
        .theme-btn:hover { 
            background-color: #4e3d2f !important; 
        }
        .theme-table thead th {
            background-color: #6b5b3e !important;
            color: white !important;
            border-bottom: 2px solid #8a7d4f !important;
        }
        /* Badges de priorité de la photo */
        .bg-badge-haute { background-color: #bd3a3a !important; color: white; }
        .bg-badge-moyenne { background-color: #d9a05b !important; color: white; }
        .bg-badge-basse { background-color: #8da383 !important; color: white; }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="theme-title fw-bold m-0">📋 Workspace des Tâches</h1>
        </div>

        <div class="card mb-4 theme-card p-3">
            <div class="card-body">
                <form id="taskForm" class="row g-3 align-items-center border-0 p-0 bg-transparent shadow-none w-100 text-start">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold" style="color: #5c4033;">Titre de la tâche</label>
                        <input type="text" id="taskTitle" class="form-control theme-input" placeholder="Ex: Développer les APIs du backend" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold" style="color: #5c4033;">Priorité</label>
                        <select id="taskPriority" class="form-select theme-input">
                            <option value="basse">Basse</option>
                            <option value="moyenne" selected>Moyenne</option>
                            <option value="haute">Haute</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold" style="color: #5c4033;">Assigner à</label>
                        <select id="taskAssignTo" class="form-select theme-input">
                            <option value="" disabled selected hidden>membres</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold" style="color: #5c4033;">Date limite</label>
                        <input type="date" id="taskDeadline" class="form-control theme-input">
                    </div>
                    <div class="col-md-2 mt-4 pt-2">
                        <button type="submit" class="btn theme-btn w-100 fw-bold py-2">Ajouter</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0 theme-card overflow-hidden">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0 theme-table">
                    <thead>
                        <tr>
                            <th class="px-4">Titre de la tâche</th>
                            <th>Priorité</th>
                            <th>Statut</th>
                            <th>Assigné à</th>
                            <th>Deadline</th>
                            <th class="text-end px-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        </tbody>
                </table>
            </div>
        </div>
         <!-- HISTORIQUE DES ACTIVITÉS-->
    <div class="container py-3">
        <div class="card theme-card p-3">
            <h2 class="theme-title fw-bold mb-3">📜 Historique des activités</h2>
            <ul id="activityList" style="list-style: none; padding: 0;">
                <li>Chargement...</li>
            </ul>
        </div>
    </div>
    <!-- MODAL MODIFICATION TÂCHE -->
    <div id="editModal" class="hidden" style="position: fixed; inset: 0; background: rgba(92,64,51,0.5); display: flex; align-items: center; justify-content: center; z-index: 100;">
        <div style="background: #fffaf2; border-radius: 15px; padding: 36px; width: 400px; border: 2px solid #8a7d4f;">
            <h2 style="color: #5c4033; margin-bottom: 20px; text-align: center;">Modifier la tâche</h2>
            <input type="hidden" id="editTaskId">
            <div style="margin-bottom: 16px;">
                <label style="color: #5c4033; font-weight: bold;">Titre</label>
                <input type="text" id="editTaskTitle" class="form-control theme-input mt-1">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="color: #5c4033; font-weight: bold;">Priorité</label>
                <select id="editTaskPriority" class="form-select theme-input mt-1">
                    <option value="basse">Basse</option>
                    <option value="moyenne">Moyenne</option>
                    <option value="haute">Haute</option>
                </select>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="btn theme-btn w-100" onclick="saveEditTask()">Sauvegarder</button>
                <button class="btn w-100" style="background: #f5f0e6; color: #6b5b3e; border: 1px solid #8a7d4f;" onclick="closeEditTask()">Annuler</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/activities.js"></script>
</body>
</html>
