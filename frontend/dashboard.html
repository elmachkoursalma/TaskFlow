<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord — TaskFlow</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <button id="logout">Déconnexion</button>
  <h1>Mon tableau de bord</h1>

  <div class="cards">
    <div class="card">
      <h2 id="activeProjects">—</h2>
      <p>Projets actifs</p>
    </div>
    <div class="card">
      <h2 id="assignedTasks">—</h2>
      <p>Tâches assignées</p>
    </div>
    <div class="card">
      <h2 id="doneTasks">—</h2>
      <p>Tâches terminées</p>
    </div>
    <div class="card red">
      <h2 id="overdueTasks">—</h2>
      <p>Tâches en retard</p>
    </div>
  </div>

 <h2>Tâches en cours</h2>
 <div style="margin: 20px 0; display: flex; gap: 15px;">

  <input
    type="text"
    id="searchInput"
    placeholder="Rechercher une tâche..."
    style="padding: 10px; width: 250px;"
  >

  <select id="statusFilter" style="padding: 10px;">
    <option value="">Tous les statuts</option>
    <option value="Pending">Pending</option>
    <option value="In Progress">In Progress</option>
    <option value="Completed">Completed</option>
  </select>

  <select id="priorityFilter" style="padding: 10px;">
    <option value="">Toutes les priorités</option>
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
  </select>

 </div>
  <table>
    <thead>
      <tr>
        <th>Titre</th>
        <th>Priorité</th>
        <th>Projet</th>
        <th>Deadline</th>
      </tr>
    </thead>
    <tbody id="taskList"></tbody>
  </table>

  <script src="js/dashboard.js"></script>
</body>
</html>
